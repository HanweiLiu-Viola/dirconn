version: 1
name: coupling
description: >-
  How the recovery changes with the strength of the coupling. The three simple topologies whose
  edges all share one strength (a chain, a collider, a common driver), the coupling set to 0.1 and
  0.2 (the file strength 0.4 is in the full protocol), EEG, partly coherent sources, the grid of
  full in SNR and length, the five estimators at BIC order (the order setting is compared in full
  and order), ten seeds. The other scenarios have edges of different strengths and cannot take this
  axis.
scenarios: [chain, collider, common_driver]
coupling: [0.1, 0.2]
estimators:
  - gc/bic
  - gc_pairwise/bic
  - dtf/bic
  - pdc/bic
  - gpdc/bic
n_seeds: 10
snr_db: [0, -5, -10]
duration_s: [30, 60]
source_model: [partial]
modality: [eeg]
budget_hours: 0.37
