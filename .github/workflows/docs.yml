name: Documentation

# Builds the documentation with every tutorial executed (also 7, 8, 13 and 14, which need the MNE
# sample dataset) and publishes it to GitHub Pages. Runs on pushes to main that touch the package,
# the tutorials or the docs, and by hand. A pull request only checks that the pages build
# (tests/test_docs_build.py in CI); executing every tutorial takes too long for each push to a PR.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      quick:
        description: "Run the tutorials in their quick mode (shorter simulations; numbers differ)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  MNE_DATA: /home/runner/mne_data
  # executed with the full simulations unless a manual run asks for the quick mode
  DIRCONN_QUICK: ${{ inputs.quick && '1' || '' }}
  DIRCONN_DOCS_SAMPLE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for MNE's 3D plotting without a display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs,connectivity,pcmci,stats,parallel,speed,plot,plot-extra]" pyqt6
      - name: Cache the MNE sample dataset
        uses: actions/cache@v4
        with:
          path: ${{ env.MNE_DATA }}
          key: mne-sample-data-v1
      - name: Get the MNE sample dataset (downloaded only when the cache is empty)
        run: |
          mkdir -p "$MNE_DATA"
          python -c "import dirconn; print(dirconn.datasets.require_sample(download=True))"
      - name: Build
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python -m sphinx -b html docs docs/_build/html
      - name: Say how the pages were built
        run: |
          mode=$([ -n "$DIRCONN_QUICK" ] && echo quick || echo full)
          echo "dirconn docs: tutorials run in $mode mode, commit $GITHUB_SHA" > docs/_build/html/BUILD_INFO.txt
          cat docs/_build/html/BUILD_INFO.txt
          cat docs/sg_execution_times.rst 2>/dev/null | head -40 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
