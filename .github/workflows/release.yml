name: Release

# Publishes dirconn to PyPI with Trusted Publishing (no API token is stored anywhere).
#
# * A published GitHub release (tag vX.Y.Z) builds the sdist and the wheel once, uploads them to
#   TestPyPI first and then, if that worked, to PyPI. Zenodo archives the same release.
# * A manual run (workflow_dispatch) builds the current commit and uploads it to TestPyPI only,
#   to try the pipeline; TestPyPI accepts every version once, so this works for .devN versions.
#
# PyPI and TestPyPI must each have a trusted publisher for this repository, this workflow file
# and the environment named below (pypi, testpypi).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist
      - name: The tag and the package version agree
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import email, glob, zipfile; w = glob.glob('dist/*.whl')[0]; m = zipfile.ZipFile(w).read(next(n for n in zipfile.ZipFile(w).namelist() if n.endswith('METADATA'))); print(email.message_from_bytes(m)['Version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, package $version"
          test "$tag" = "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dirconn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dirconn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
