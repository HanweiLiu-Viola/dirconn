version: 1
name: direction_flip
description: >-
  The coupling between A and B reverses in the middle of the recording: A -> B for the first 30 s,
  B -> A for the last 30 s; B -> C is a constant control edge. Tests whether a time-resolved method
  follows a change of direction, where the pair is coupled all the time and only the direction
  changes.
defaults:
  sfreq: 100.0
  duration_s: 60.0
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 10.0, active: [[0.0, 30.0]]}
    - {source: cuneus-rh, target: transversetemporal-rh, strength: 0.4, delay_ms: 10.0, active: [[30.0, 60.0]]}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
