version: 1
name: delay_5
description: >-
  A -> B with coupling 0.4 and a delay of five samples (50 ms); C is unconnected and gives the
  null edges. The delay is the only difference to the other delay scenarios.
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 50.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
