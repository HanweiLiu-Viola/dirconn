version: 1
name: distance_mid
description: >-
  A -> B with coupling 0.4 and a delay of 10 ms between two regions of the same hemisphere
  whose centres are 58 mm apart: the middle tercile of the distances between regions of that
  hemisphere with visibility 0.9 to 1.5 (scripts/pick_regions.py distance). Only the distance
  differs between the three distance scenarios; the leakage between A and B falls with it.
network:
  nodes:
    - name: posteriorcingulate-rh
    - name: rostralanteriorcingulate-rh
  edges:
    - {source: posteriorcingulate-rh, target: rostralanteriorcingulate-rh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    posteriorcingulate-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    rostralanteriorcingulate-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
