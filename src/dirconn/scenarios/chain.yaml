version: 1
name: chain
description: >-
  A -> B -> C, each step with coupling 0.4 and a delay of one sample (10 ms at 100 Hz); the
  baseline every other scenario is compared with. A, B, C are the first three regions of the
  pool (transversetemporal-rh, cuneus-rh, transversetemporal-lh) oscillating at 10, 20 and
  15 Hz. Pairwise methods are expected to report the indirect path A -> C as well.
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 10.0}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
