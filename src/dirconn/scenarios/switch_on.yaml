version: 1
name: switch_on
description: >-
  A -> B switches on in the middle of the recording (30 s of 60 s); B -> C is a constant control
  edge. A, B, C are the first three regions of the pool oscillating at 10, 20 and 15 Hz, coupling
  0.4 with a delay of one sample (10 ms at 100 Hz). Tests whether a time-resolved method sees an
  edge appear, and how long it takes.
defaults:
  sfreq: 100.0
  duration_s: 60.0
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 10.0, active: [[30.0, 60.0]]}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
