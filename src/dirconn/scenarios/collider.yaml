version: 1
name: collider
description: >-
  A -> C and B -> C, coupling 0.4, delay 10 ms; D is unconnected. Nothing between A and B
  should be reported; conditioning matters for the pairwise methods here.
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
    - name: rostralanteriorcingulate-lh
  edges:
    - {source: transversetemporal-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
    rostralanteriorcingulate-lh: {kind: oscillator, freq_hz: 12.0, bandwidth_hz: 4.0}
