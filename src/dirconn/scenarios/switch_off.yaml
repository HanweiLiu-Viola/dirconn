version: 1
name: switch_off
description: >-
  A -> B switches off in the middle of the recording (acts for the first 30 s of 60 s); B -> C is a
  constant control edge. The mirror image of switch_on: tests whether a time-resolved method lets
  an edge go, and how long it takes.
defaults:
  sfreq: 100.0
  duration_s: 60.0
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 10.0, active: [[0.0, 30.0]]}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
