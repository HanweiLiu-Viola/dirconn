  order, and the graph has a cycle), strengths 0.2 to 0.4, delays 1 to 3 samples,
  oscillators of 8 to 30 Hz. Drawn with seed 1010; 4 rejected (spectral radius 0.95
  or more) and 3 redrawn (no cycle) before this one, whose spectral radius is 0.892.
