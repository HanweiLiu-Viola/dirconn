version: 1
name: burst
description: >-
  A -> B acts only for a short burst (25 s to 35 s of a 60 s recording, off - on - off); B -> C is
  a constant control edge. Tests whether a time-resolved method can see a coupling that is on for a
  time comparable to its own memory, and how a long window or memory smears it.
defaults:
  sfreq: 100.0
  duration_s: 60.0
network:
  nodes:
    - name: transversetemporal-rh
    - name: cuneus-rh
    - name: transversetemporal-lh
  edges:
    - {source: transversetemporal-rh, target: cuneus-rh, strength: 0.4, delay_ms: 10.0, active: [[25.0, 35.0]]}
    - {source: cuneus-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    cuneus-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 15.0, bandwidth_hz: 4.0}
