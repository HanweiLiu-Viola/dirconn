version: 1
name: leakage_adjacent_cingulate_rh
description: >-
  A geometry of the leakage_adjacent family for the leakage controls (issue #9), with the same
  dynamics: Z -> X is the only edge (0.4, 10 ms). Y is a neighbour of X into whose series X leaks:
  paracentral-rh (X) and posteriorcingulate-rh (Y) are 25 mm apart, X leaks 2.18 (EEG) and 1.78
  (gradiometers) into Y, and the pair is in the leakiest tenth of all region pairs on both (pair 4
  of tools/pick_regions.py leakage). Z, cuneus-rh, is far from both and leaks little into them
  (distant_region). Nothing drives Y, so every edge into Y that an estimator finds at source level
  (Z -> Y, X -> Y) is leakage; at region level there is none.
network:
  nodes:
    - name: cuneus-rh
    - name: paracentral-rh
    - name: posteriorcingulate-rh
  edges:
    - {source: cuneus-rh, target: paracentral-rh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    cuneus-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    paracentral-rh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    posteriorcingulate-rh: {kind: oscillator, freq_hz: 12.0, bandwidth_hz: 4.0}
