version: 1
name: leakage_adjacent_temporal_lh
description: >-
  A geometry of the leakage_adjacent family for the leakage controls (issue #9), with the same
  dynamics: Z -> X is the only edge (0.4, 10 ms). Y is a neighbour of X into whose series X leaks:
  transversetemporal-lh (X) and superiortemporal-lh (Y) are 12 mm apart, X leaks 3.12 (EEG) and
  5.30 (gradiometers) into Y, and the pair is in the leakiest tenth of all region pairs on both
  (pair 1 of tools/pick_regions.py leakage). Z, transversetemporal-rh, is far from both and leaks
  little into them (distant_region). Nothing drives Y, so every edge into Y that an estimator
  finds at source level (Z -> Y, X -> Y) is leakage; at region level there is none.
network:
  nodes:
    - name: transversetemporal-rh
    - name: transversetemporal-lh
    - name: superiortemporal-lh
  edges:
    - {source: transversetemporal-rh, target: transversetemporal-lh, strength: 0.4, delay_ms: 10.0}
dynamics:
  nodes:
    transversetemporal-rh: {kind: oscillator, freq_hz: 10.0, bandwidth_hz: 4.0}
    transversetemporal-lh: {kind: oscillator, freq_hz: 20.0, bandwidth_hz: 4.0}
    superiortemporal-lh: {kind: oscillator, freq_hz: 12.0, bandwidth_hz: 4.0}
