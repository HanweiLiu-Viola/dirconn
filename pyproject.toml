[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dirconn"
version = "0.1.0"
description = "Directed functional connectivity for neurophysiology signals at sensor and region level."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Hanwei Liu", email = "Liu_H@ukw.de" }]
keywords = ["neuroscience", "EEG", "MEG", "LFP", "directed connectivity", "Granger causality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "mne>=1.5",
    # MNE reads the cortical parcellations (head models, region maps) with nibabel
    "nibabel>=5",
    "mne-bids>=0.14",
    "pybv>=0.7.3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://hanweiliu-viola.github.io/dirconn/"
Documentation = "https://hanweiliu-viola.github.io/dirconn/"
Source = "https://github.com/HanweiLiu-Viola/dirconn"
Issues = "https://github.com/HanweiLiu-Viola/dirconn/issues"
Changelog = "https://github.com/HanweiLiu-Viola/dirconn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
connectivity = ["mne-connectivity>=0.6"]
# tigramite imports joblib without declaring it (seen with tigramite 5.2.10.1)
pcmci = ["tigramite>=5.2", "joblib>=1.3"]
stats = ["statsmodels>=0.14"]
parallel = ["joblib>=1.3"]
speed = ["numba>=0.58"]
# the KSG estimator on a GPU; install a CUDA or XPU build of torch as pytorch.org describes
gpu = ["torch>=2.3"]
# pyCirclize (the chord diagram of dirconn.viz) draws with matplotlib only, so it sits here
plot = ["matplotlib>=3.7", "pycirclize>=1.10"]
# 3D only: tested with pyvistaqt 0.13; MNE's 3D plot also needs a Qt binding
plot-extra = ["pyvistaqt>=0.13"]
all = ["dirconn[connectivity,pcmci,stats,parallel,speed,gpu,plot,plot-extra]"]
docs = ["sphinx>=7", "sphinx-gallery>=0.16", "myst-parser>=3", "pydata-sphinx-theme>=0.15"]
dev = ["pytest>=8", "packaging", "ruff>=0.5", "mypy>=1.10", "nbformat>=5", "sphinx>=7", "sphinx-gallery>=0.16", "myst-parser>=3", "pydata-sphinx-theme>=0.15", "tigramite>=5.2", "joblib>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/dirconn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not sample_data and not gpu'"
filterwarnings = [
    "error::RuntimeWarning",
    # Benign ABI notice emitted by Cython extensions (netCDF4) built against an older numpy.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "sample_data: needs the MNE sample dataset (~1.5 GB); never run by default",
    "gpu: needs torch with a CUDA device; never run by default (run with -m gpu)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/auto_tutorials", "docs/generated", "docs/_build"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# tutorials are scripts of "# %%" cells: imports sit where they are first used, prose lines are long
"examples/**" = ["D", "E402", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/dirconn"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
